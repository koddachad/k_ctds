[build-system]
# setuptools 77 is the first release with PEP 639 license expressions and
# project.license-files.
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k-ctds"
version = "2.2.0"
description = "DB API 2.0-compliant driver for SQL Server"
readme = "README.rst"
license = "MIT"
# Ship the third-party notices in wheels and sdists too; the default pattern
# only picks up LICENSE*, COPYING*, NOTICE* and AUTHORS*.
license-files = ["LICENSE", "LICENSE.*", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.9"
authors = [
    { name = "Chad Ongstad", email = "chad@kodda.io" },
]
keywords = [
    "freetds",
    "mssql",
    "SQL",
    "T-SQL",
    "TDS",
    "SQL Server",
    "DB-API",
    "PEP-0249",
    "database",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: SQL",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/koddachad/k_ctds"
Documentation = "https://koddachad.github.io/k_ctds/"
Changelog = "https://github.com/koddachad/k_ctds/blob/master/CHANGELOG.md"

[project.optional-dependencies]
entra = ["azure-identity>=1.15"]
test = ["pytest", "pytest-cov", "coverage"]
docs = ["recommonmark", "sphinx", "sphinx_rtd_theme"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
k_ctds = []

# ---------------------------------------------------------------------------
# cibuildwheel — builds wheels with FreeTDS + OpenSSL bundled
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
# Build only CPython, skip 32-bit and musl for now
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-manylinux_i686 *-musllinux*"

# FreeTDS version to bundle — update this when upgrading. The matching
# freetds/fedauth-<version>.patch (Microsoft Entra ID token authentication)
# is applied on top of the stock release tarball; a new version needs a
# refreshed patch file.
environment = { FREETDS_VERSION = "1.5.21" }

test-requires = "pytest"
# Smoke test: import ctds and check the bundled FreeTDS is loadable
test-command = "python -c \"import k_ctds; print(k_ctds.apilevel)\""

[tool.cibuildwheel.linux]
# Build FreeTDS from source inside the manylinux container, then build ctds
# against it. FreeTDS is DYNAMICALLY linked (shared library) — this is
# important for LGPL compliance, as it allows users to replace the bundled
# libsybdb.so with their own version. auditwheel (run automatically by
# cibuildwheel) will vendor the .so files into the wheel.
before-all = """
    set -ex
    PROJECT_DIR="$(cd {project} && pwd)"
    # OpenSSL: built from source at the pinned LTS release rather than taken
    # from the build image, whose OpenSSL is 1.1.1 (end-of-life, and under a
    # different licence than the OpenSSL 3 that THIRD_PARTY_NOTICES documents).
    # /etc/ssl as OPENSSLDIR lets the bundled library find the host CA store
    # on both Debian- and RHEL-family systems.
    yum install -y perl-core || apk add --no-cache perl || apt-get install -y perl
    curl -sSfL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" -o /tmp/openssl.tar.gz
    echo "${OPENSSL_SHA256}  /tmp/openssl.tar.gz" | sha256sum -c -
    tar -xzf /tmp/openssl.tar.gz -C /tmp
    cd /tmp/openssl-${OPENSSL_VERSION}
    ./config --prefix=/usr/local/openssl --openssldir=/etc/ssl --libdir=lib shared no-tests
    make -j$(nproc)
    make install_sw
    echo /usr/local/openssl/lib > /etc/ld.so.conf.d/openssl.conf
    ldconfig
    curl -sSf "https://www.freetds.org/files/stable/freetds-${FREETDS_VERSION}.tar.gz" -o /tmp/freetds.tar.gz
    tar -xzf /tmp/freetds.tar.gz -C /tmp
    cd /tmp/freetds-${FREETDS_VERSION}
    patch -p1 < "${PROJECT_DIR}/freetds/fedauth-${FREETDS_VERSION}.patch"
    CFLAGS="-Wno-error=incompatible-pointer-types" ./configure --prefix=/usr/local --with-openssl=/usr/local/openssl --enable-msdblib
    make -j$(nproc)
    make install
    ldconfig
"""
environment-pass = ["FREETDS_VERSION"]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

# Point the build at the FreeTDS we just compiled
[tool.cibuildwheel.linux.environment]
FREETDS_VERSION = "1.5.21"
# OpenSSL LTS release built into Linux wheels; the checksum is the one
# published with the release. Update both together.
OPENSSL_VERSION = "3.5.9"
OPENSSL_SHA256 = "603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a"
CTDS_INCLUDE_DIRS = "/usr/local/include"
CTDS_LIBRARY_DIRS = "/usr/local/lib"
CTDS_RUNTIME_LIBRARY_DIRS = "/usr/local/lib"

[tool.cibuildwheel.macos]
before-all = """
    set -ex
    PROJECT_DIR="$(cd {project} && pwd)"
    brew install openssl@3
    curl -sSf "https://www.freetds.org/files/stable/freetds-${FREETDS_VERSION}.tar.gz" -o /tmp/freetds.tar.gz
    tar -xzf /tmp/freetds.tar.gz -C /tmp
    cd /tmp/freetds-${FREETDS_VERSION}
    patch -p1 < "${PROJECT_DIR}/freetds/fedauth-${FREETDS_VERSION}.patch"
    ./configure --prefix=/usr/local --with-openssl=$(brew --prefix openssl@3) --enable-msdblib
    make -j$(sysctl -n hw.ncpu)
    sudo make install
"""
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos.environment]
FREETDS_VERSION = "1.5.21"
CTDS_INCLUDE_DIRS = "/usr/local/include"
CTDS_LIBRARY_DIRS = "/usr/local/lib"
CTDS_RUNTIME_LIBRARY_DIRS = "/usr/local/lib"

[tool.cibuildwheel.windows]
# On Windows, the existing freetds-install.ps1 builds FreeTDS + win-iconv
# into build\include and build\lib. cibuildwheel runs before-all before
# building wheels for each Python version.
before-all = "powershell windows\\freetds-install.ps1"
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair --add-path build/lib -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows.environment]
FREETDS_VERSION = "1.5.21"
CTDS_INCLUDE_DIRS = "build/include"
CTDS_LIBRARY_DIRS = "build/lib"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# check-manifest
# ---------------------------------------------------------------------------
[tool.check-manifest]
ignore = [
    ".dockerignore",
    ".python-version",
    "appveyor.yml",
    "codecov.yml",
    "CHANGELOG.md",
    "Dockerfile-valgrind",
    "Makefile",
    "pylintrc",
    "tox.ini",
    "conftest.py",
    ".github",
    ".github/*",
    "appveyor",
    "appveyor/*",
    "doc",
    "doc/*",
    "freetds",
    "freetds/*",
    "misc",
    "misc/*",
    "scripts",
    "scripts/*",
    "tests",
    "tests/*",
    "tests/pool",
    "tests/pool/*",
    "windows",
    "windows/*",
]
